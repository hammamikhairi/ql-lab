<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify a certificate · Certificate Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo">DU</span> Demo University <span class="muted">· verify a certificate</span></a>
  </header>
  <main class="wrap">
    <section class="card narrow">
      <p class="eyebrow">for employers</p>
      <h1>Is this certificate real?</h1>
      <p class="muted">Type the verification code printed on the certificate.</p>
      <form id="verify-form" autocomplete="off">
        <label for="code">Verification code</label>
        <input id="code" type="text" placeholder="A1B2C3D4E5" required>
        <button class="btn block" type="submit">Check</button>
      </form>
      <div id="result" role="status"></div>
    </section>
  </main>
  <footer class="foot"><a href="/">student portal</a> · <a href="/dashboard">ops dashboard</a></footer>
  <script src="/verify.js"></script>
</body>
</html>
